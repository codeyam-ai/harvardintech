# Build the Astro static site and publish it. ONE branch, one site.
#
# TODAY — pre-launch. The site is not public; harvardintech.com is still
# Strikingly's, and the one site below is passphrase-gated:
#
#   main → codeyam-ai.github.io/harvardintech   passphrase-gated + noindex,
#          drafts visible, serves /admin.
#
# This is the link the team has, AND where the content editor commits. An edit
# saved in /admin lands on `main` and is on the site in about two minutes. There
# is no promote step any more, and nothing to keep in sync.
#
# WHY ONE BRANCH. Until 2026-09-12 there were two: `staging` for day-to-day work
# and `main` for reviewing, joined by a manual Promote. Every `staging` deploy had
# failed since 2026-08-20 (an unquoted preview timestamp the schema rejected, now
# fixed in src/lib/previewFieldsSchema.ts), so the editor's saves reached nothing,
# and Promote was blocked besides because the branches had diverged. The second
# track cost real reliability and bought a separation nobody was using. See
# .codeyam/plans/completed/one-site-content-edits-publish-straight-to-main.md.
#
# WHY GITHUB.IO AND NOT review.harvardintech.com: standing up the review
# subdomain means adding a DNS record to harvardintech.com, and we do not have
# the go-ahead to touch that domain yet. The repo's own Pages URL needs no DNS,
# so the domain stays untouched until the migration is approved.
#
# AT THE STRIKINGLY CUTOVER `main` becomes the public site:
#
#   main → harvardintech.com   open, indexable, drafts hidden, no /admin,
#                              sitemap published.
#
# Reaching that state means dropping PREVIEW_GATE/INCLUDE_DRAFTS from this build
# AND standing a gated track back up — together, never one without the other, or
# nothing is protected and /admin ships publicly. The gated track returns as a
# PRIVATE EDITOR BUILD OF `main` published to the kept second repository
# (nseldeib/harvardintech-staging, whose REVIEW_DEPLOY_KEY secret is retained for
# exactly this), pointed at review.harvardintech.com. That is a launch-day step,
# not a branch. See DEPLOY_SETUP.md.
#
# The CMS Draft toggle is now the only axis that phases a change: it phases
# CONTENT. Code is phased by not merging it.
#
# What varies between a gated build and a public one is entirely environmental —
# see astro.config.mjs (base/site, conditional CMS + sitemap),
# src/lib/previewGate.ts (PREVIEW_GATE) and src/lib/draftVisibility.ts
# (INCLUDE_DRAFTS). There is no per-track code.
#
# Setup: none in the common case. The build job's "Enable / configure GitHub
# Pages" step turns Pages on automatically. If your org policy blocks
# token-based enablement and the first deploy 404s, run
# `scripts/enable-pages.sh` once (or toggle the UI) and re-run — see
# DEPLOY_SETUP.md.
#
# REQUIRED SECRET: PREVIEW_GATE_PASSPHRASE. The build refuses to ship a gate with
# no passphrase, so this workflow FAILS without it. It did not survive the move
# to the codeyam-ai account, which is why every deploy between 2026-09-12 and
# 2026-09-17 failed.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Nightly, so an event created on Luma reaches the site without anyone
  # pushing. 07:10 UTC is the small hours in New York and early morning in
  # London — after the day's events are set, before anyone looks.
  #
  # GitHub DISABLES a scheduled workflow in a repository with no activity for
  # 60 days. A quiet stretch after launch therefore stops this job silently;
  # any push, or one manual run from the Actions tab, starts it again. See
  # DEPLOY_SETUP.md.
  schedule:
    - cron: '10 7 * * *'
  workflow_dispatch:

# `contents: write` so the nightly run can commit the events it imported from
# Luma back to `main`. That commit uses GITHUB_TOKEN, which deliberately does
# NOT retrigger this workflow — no loop — and none is needed, because the run
# that wrote the files goes on to build and deploy them itself.
permissions:
  contents: write
  pages: write
  id-token: write

# One branch now, so one group. The ref stays in the name anyway: it costs
# nothing and keeps a manually dispatched run on another ref from cancelling the
# deploy of `main`.
concurrency:
  group: pages-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  # ---- main → codeyam-ai.github.io/harvardintech (gated today) ------------
  build:
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    steps:
      # Check out the branch TIP, not `github.sha`. This mattered when promote.yml
      # called this workflow after a fast-forward; with one branch it is simply
      # the safer default — a manually dispatched run publishes what is on `main`
      # now, not what was there when the run was queued.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      # Enable Pages (build type "workflow") if it isn't already. Idempotent —
      # a no-op once Pages exists — so it's safe on every push. Runs before the
      # build so the Pages site exists by the time the deploy job publishes.
      # We use it only for this enablement side effect; base/site stay driven by
      # the DEPLOY_BASE_PATH/PAGES_SITE env vars below (its outputs are unused).
      - name: Enable / configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          # Pages is already enabled (Settings → Pages → Source: GitHub Actions),
          # so we do NOT ask the action to create/enable it — token-based
          # enablement returns an HTML error on this repo. enablement:false just
          # reads the existing Pages config for the upload/deploy steps.
          enablement: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        # The repo's postinstall downloads a Playwright Chromium for local
        # scenario capture. A deploy build never drives a browser, so skip the
        # ~150MB download on both tracks.
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm ci
      # Pull anything new off the Luma calendar before building, so the site
      # does not wait for someone to re-type an event that already exists.
      #
      # It never overwrites an entry that is already in the collection, so an
      # edit made in /admin survives every run. If Luma is unreachable the
      # script says so and exits 0, and the build ships the events already
      # committed rather than failing or emptying the page.
      - name: Import events from Luma
        run: node scripts/import-luma.mjs --past
      # Commit them back so the repo, the CMS and the site agree on what the
      # calendar holds. `--quiet` exits non-zero only when there is something
      # to commit, so a night with no new events is a clean no-op.
      - name: Commit imported events
        run: |
          if git diff --quiet -- src/content/events; then
            echo "no new events from Luma"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/content/events
          git commit -m "content: import events from Luma [skip ci]"
          git push origin HEAD:${{ github.ref_name }}
      - name: Build site
        env:
          # The domain cutover flips these two: drop DEPLOY_BASE_PATH (base → '/')
          # and point PAGES_SITE at https://harvardintech.com. Nothing else changes.
          DEPLOY_BASE_PATH: /harvardintech
          # Where the preview is really hosted (the repo moved to codeyam-ai).
          PAGES_SITE: https://codeyam-ai.github.io
          # What every canonical link, share card and structured-data URL names:
          # the live domain, never the gated preview. At launch PAGES_SITE
          # becomes this same value and this line can go.
          CANONICAL_ORIGIN: https://harvardintech.com
          # The gate's passphrase lives only in this secret. A gated build
          # without it fails instead of shipping a gate anyone can open.
          PREVIEW_GATE_PASSPHRASE: ${{ secrets.PREVIEW_GATE_PASSPHRASE }}
          # PRE-LAUNCH: `main` is NOT the public site yet. harvardintech.com is
          # still served by Strikingly, and this deploy is the private preview
          # the team reviews — so it is passphrase-gated, noindex, and shows
          # drafts, and it serves /admin so the CMS can edit it.
          #
          # REMOVING THESE TWO LINES IS WHAT TAKES THE SITE PUBLIC. Do it only
          # at the Strikingly cutover, and only once a private editor build of
          # `main` is standing on the kept second repository — otherwise there is
          # nothing left protecting the preview and /admin ships to the world.
          # See DEPLOY_SETUP.md.
          PREVIEW_GATE: '1'
          INCLUDE_DRAFTS: '1'
        run: npm run build
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

# The gated review track returns at launch as a PRIVATE EDITOR BUILD OF `main`
# published to the kept second repository (nseldeib/harvardintech-staging) and
# pointed at review.harvardintech.com. Its REVIEW_DEPLOY_KEY secret is retained
# here for exactly that. It is a launch-day step, not a branch — see
# DEPLOY_SETUP.md. The `review` job that used to build the `staging` branch was
# removed on 2026-09-17 with the one-site change.
